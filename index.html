<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </head>
    <body>
        <div id="app"></div>
        <script type="importmap-shim" src="./deno.json"></script>
        <script type="module-shim">
            import App from "js/app.js";
            App(
            {
                configure({theme})
                {
                    theme.extend.colors.gradientA = "red";
                    theme.extend.colors.gradientB = "blue";
                }
            }
            );
        </script>
        <script async src="https://unpkg.com/es-module-shims@0.13.1/dist/es-module-shims.min.js"></script>
    </body>
</html>
